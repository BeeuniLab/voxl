name: Release
on:
  push:
    tags: ['v*-beeuni.*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and test
        run: docker build --file Dockerfile.release --output type=local,dest=dist .
      - name: Check Linux binary
        run: |
          file dist/voxl
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/scripts:/scripts:ro" -v "$PWD/web:/web:ro" ubuntu:24.04 bash /scripts/release-smoke.sh
      - name: Compress
        run: |
          gzip -n -9 dist/voxl
          mv dist/voxl.gz dist/voxl-linux-${{ matrix.arch }}.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Beeuni VOXL ${GITHUB_REF_NAME#v}" --notes-file ../RELEASE_NOTES.md *.gz SHA256SUMS
